<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONIR BO CINÉMA</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; background: #09090d; color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
        }
        header {
            background: #151925; padding: 18px; text-align: center;
            border-bottom: 2px solid #e50914;
        }
        .logo { font-size: 25px; font-weight: bold; }
        .logo span { color: #e50914; }
        .hero { padding: 30px 16px; text-align: center; background: linear-gradient(to bottom, #151925, #09090d); }
        .hero h1 { font-size: 28px; margin-bottom: 10px; }
        .hero p { color: #a0a5b5; margin-bottom: 20px; }
        .search-box {
            display: flex; justify-content: center; gap: 10px; max-width: 500px; margin: 0 auto;
        }
        input[type="search"] {
            width: 75%; max-width: 450px; padding: 13px; border: 0; border-radius: 8px;
            outline: none; background: #1f2638; color: #fff; font-size: 15px;
        }
        .search-box button {
            padding: 13px 20px; background: #e50914; border: 0; color: #fff;
            border-radius: 8px; font-weight: bold; cursor: pointer;
        }
        .filters {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 15px;
        }
        .filters button {
            padding: 8px 16px; background: #242b3c; border: 0; color: #fff;
            border-radius: 20px; cursor: pointer; font-size: 14px;
        }
        .filters button.active { background: #e50914; }
        h2 { padding: 0 16px; font-size: 20px; }
        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px; padding: 16px;
        }
        .card {
            background: #171c29; border-radius: 12px; overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; transition: transform 0.2s;
        }
        .card:hover { transform: scale(1.03); }
        .card img {
            width: 100%; height: 210px; object-fit: cover; background: #000; display: block;
        }
        .card h3 {
            font-size: 13px; padding: 10px 8px 4px 8px; margin: 0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .card p { font-size: 11px; color: #a0a5b5; padding: 0 8px 10px 8px; margin: 0; }
        #message { text-align: center; color: #a0a5b5; padding: 25px; font-size: 16px; }
        
        /* Modal Player */
        #playerbox {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 1000; padding: 20px; overflow-y: auto;
        }
        .player-content { max-width: 800px; margin: 40px auto; background: #151925; border-radius: 12px; padding: 20px; position: relative; }
        .close-btn { position: absolute; left: 15px; top: 15px; background: #e50914; color: #fff; border: 0; padding: 8px 15px; border-radius: 6px; cursor: pointer; }
        .iframe-container { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; margin-top: 15px; }
        .iframe-container iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:0; border-radius:8px; }
        
        footer {
            text-align: center; padding: 25px; color: #999; font-size: 13px;
            margin-top: 40px; border-top: 1px solid #1f2638;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MONIR <span>BO</span> CINÉMA</div>
        <p style="margin:5px 0 0 0; color:#8a8f9d; font-size:12px;">عالم الأفلام والمسلسلات</p>
    </header>

    <section class="hero">
        <h1>مرحباً بك في عالم السينما</h1>
        <p>اكتشف آلاف الأفلام والمسلسلات المتاحة للمشاهدة</p>
        <div class="search-box">
            <input type="search" id="search" placeholder="ابحث عن فيلم أو مسلسل...">
            <button onclick="loadMovies()">بحث</button>
        </div>
    </section>

    <div class="filters">
        <button class="active" onclick="category('all', this)">الكل</button>
        <button onclick="category('animation', this)">الرسوم المتحركة والأنمي</button>
        <button onclick="category('classic', this)">أفلام كلاسيكية</button>
        <button onclick="category('tv', this)">مسلسلات وبرامج</button>
    </div>

    <h2 id="heading">الأفلام المقترحة</h2>
    <div id="message">جاري التحميل...</div>
    <div class="grid" id="movies"></div>

    <!-- Player Modal -->
    <div id="playerbox">
        <div class="player-content">
            <button class="close-btn" onclick="closePlayer()">إغلاق ✕</button>
            <h2 id="movieTitle" style="padding:0; margin-bottom:10px;"></h2>
            <p id="movieDescription" style="color:#a0a5b5; font-size:14px;"></p>
            <div class="iframe-container">
                <iframe id="video" allowfullscreen></iframe>
            </div>
            <div style="margin-top:15px; text-align:left;">
                <a id="sourceHref" href="#" target="_blank" style="color:#e50914; font-size:13px; text-decoration:none;">رابط المصدر الأصلي ↗</a>
            </div>
        </div>
    </div>

    <footer>
        MONIR BO CINÉMA © 2026<br>
        منصة تجريبية للمحتوى المتاح للعموم
    </footer>

    <script>
        let currentCategory = "all";
        let currentMovies = [];

        // تنظيف النصوص
        function escapeHTML(text) {
            if(!text) return "";
            return String(text).replace(/[&<>"']/g, function(m){
                return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
            });
        }

        function category(cat, btn) {
            document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = cat;
            loadMovies();
        }

        async function loadMovies() {
            const box = document.getElementById("movies");
            const msg = document.getElementById("message");
            const term = document.getElementById("search").value.trim();

            box.innerHTML = "";
            msg.style.display = "block";
            msg.textContent = "جاري البحث في الأرشيف الشامل...";

            try {
                let moviesList = [];

                // 1. البحث في Internet Archive بنطاق موحد وشامل جداً
                let query = term ? `(${encodeURIComponent(term)})` : "*:*";

                if (currentCategory === "animation") {
                    query += " AND (subject:animation OR collection:animationandcomics OR mediatype:animation)";
                } else if (currentCategory === "classic") {
                    query += " AND (collection:feature_films OR collection:classic_tv_shows)";
                } else if (currentCategory === "tv") {
                    query += " AND (mediatype:movies OR collection:television)";
                } else {
                    query += " AND (mediatype:movies OR collection:feature_films OR collection:moviesandfilms)";
                }

                const archiveUrl = `https://archive.org/advancedsearch.php?q=${query}&fl[]=identifier,title,year,description,downloads&sort[]=downloads+desc&rows=60&page=1&output=json`;

                const res = await fetch(archiveUrl);
                const data = await res.json();

                if (data.response && data.response.docs) {
                    moviesList = data.response.docs.map(item => ({
                        id: item.identifier,
                        title: item.title || item.identifier,
                        year: item.year || "غير محدد",
                        description: item.description || "لا يوجد وصف متاح.",
                        image: `https://archive.org/services/img/${item.identifier}`,
                        videoUrl: `https://archive.org/embed/${item.identifier}`,
                        sourceUrl: `https://archive.org/details/${item.identifier}`
                    }));
                }

                // 2. إذا كان هناك بحث محدد ولم نجد نتائج كثيرة، نبحث في TVMaze API للأنمي والمسلسلات (مثل Vinland Saga)
                if (term) {
                    try {
                        const tvRes = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(term)}`);
                        const tvData = await tvRes.json();

                        const tvMovies = tvData.map(item => {
                            const show = item.show;
                            return {
                                id: 'tv_' + show.id,
                                title: show.name,
                                year: show.premiered ? show.premiered.split('-')[0] : 'TV',
                                description: show.summary ? show.summary.replace(/<[^>]*>?/gm, '') : 'مسلسل / أنمي',
                                image: show.image ? show.image.medium : 'https://via.placeholder.com/200x300?text=No+Image',
                                videoUrl: `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(show.name + " trailer")}`,
                                sourceUrl: show.url
                            };
                        });

                        moviesList = [...tvMovies, ...moviesList];
                    } catch (e) {
                        console.log("TVMaze fetch failed", e);
                    }
                }

                currentMovies = moviesList;

                if (currentMovies.length === 0) {
                    msg.textContent = "لم يتم العثور على نتائج. جرب البحث باسم آخر بكلمات بسيطة.";
                    return;
                }

                msg.style.display = "none";

                box.innerHTML = currentMovies.map((movie, index) => `
                    <div class="card" onclick="openPlayer(${index})">
                        <img src="${movie.image}" alt="${escapeHTML(movie.title)}" onerror="this.onerror=null; this.src='https://via.placeholder.com/200x300?text=No+Cover';">
                        <h3>${escapeHTML(movie.title)}</h3>
                        <p>${movie.year}</p>
                    </div>
                `).join('');

            } catch (error) {
                console.error(error);
                msg.textContent = "حدث خطأ أثناء جلب البيانات. يرجى التأكد من الاتصال بالإنترنت والمحاولة مجدداً.";
            }
        }

        function openPlayer(index) {
            const movie = currentMovies[index];
            if(!movie) return;

            document.getElementById("movieTitle").textContent = movie.title;
            document.getElementById("movieDescription").textContent = movie.description;
            document.getElementById("video").src = movie.videoUrl;
            document.getElementById("sourceHref").href = movie.sourceUrl;
            document.getElementById("playerbox").style.display = "block";
        }

        function closePlayer() {
            document.getElementById("playerbox").style.display = "none";
            document.getElementById("video").src = "";
        }

        // تشغيل البحث عند ضغط Enter في مربع البحث
        document.getElementById("search").addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                loadMovies();
            }
        });

        // تحميل القائمة الأولى عند فتح الصفحة
        loadMovies();
    </script>
</body>
</html>
